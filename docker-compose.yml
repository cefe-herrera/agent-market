services:
  postgres:
    image: postgres:16-alpine
    container_name: bnb-marketplace-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: bnb_agent_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d bnb_agent_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
